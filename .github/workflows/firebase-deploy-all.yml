name: Deploy Firestore rules, Storage rules and Functions on merge
on:
  push:
    branches:
      - main
jobs:
  deploy_rules_and_functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install root dependencies
        run: npm ci
      - name: Install functions dependencies
        run: npm ci
        working-directory: functions
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UNIEB_RECANTO }}
      - name: Deploy Firestore rules, indexes, Storage rules and Functions
        run: npx firebase-tools deploy --only firestore,storage,functions --project unieb-recanto --non-interactive --force
